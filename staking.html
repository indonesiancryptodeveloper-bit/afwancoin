<!-- MODERN STAKING DAPP SECTION -->
<style>
  .staking-card {
    background: linear-gradient(145deg, #131722, #1a1f2c);
    border: 1px solid #f0b90b;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(240, 185, 11, 0.15);
    color: #fff;
    max-width: 600px;
    margin: 50px auto;
    padding: 30px 25px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  .staking-badge {
    background: rgba(240, 185, 11, 0.1);
    border: 1px solid #f0b90b;
    color: #f0b90b;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: bold;
    display: inline-block;
    margin-bottom: 10px;
  }
  .btn-web3 {
    border: none;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    padding: 12px;
    width: 100%;
    margin: 6px 0;
  }
  .btn-primary {
    background: linear-gradient(90deg, #f0b90b, #f3ba2f);
    color: #000;
  }
  .btn-primary:hover {
    box-shadow: 0 0 15px rgba(240, 185, 11, 0.5);
    transform: translateY(-1px);
  }
  .btn-action {
    background: #2b313a;
    color: #fff;
    border: 1px solid #3a414d;
  }
  .btn-action:hover {
    background: #3a414d;
    border-color: #f0b90b;
  }
  .btn-danger {
    background: rgba(229, 62, 62, 0.1);
    color: #e53e3e;
    border: 1px solid #e53e3e;
  }
  .btn-danger:hover {
    background: #e53e3e;
    color: #fff;
  }
  .staking-box {
    background: #0b0e14;
    border-radius: 10px;
    padding: 15px;
    margin-top: 15px;
    border: 1px solid #2a2e3d;
    text-align: left;
  }
  .staking-input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #2a2e3d;
    background: #131722;
    color: #fff;
    font-size: 1rem;
    box-sizing: border-box;
    margin: 8px 0;
  }
  .staking-input:focus {
    outline: none;
    border-color: #f0b90b;
  }
</style>

<section id="staking" class="staking-card">
    <div style="text-align: center;">
        <span class="staking-badge">⚡ WEB3 LIVE VAULT</span>
        <h2 style="color: #f0b90b; margin: 5px 0 10px 0; font-size: 1.8rem;">AFWAN COIN Staking Vault</h2>
        <p style="font-size: 0.85rem; color: #a0aec0; margin-bottom: 20px;">Kunci Token AC Anda untuk Mendapatkan Rewards Harian secara Otomatis</p>
        
        <button id="btnConnect" onclick="connectWallet()" class="btn-web3 btn-primary" style="font-size: 1rem;">Hubungkan Wallet (MetaMask)</button>
        <p id="walletAddress" style="font-size: 12px; color: #f0b90b; margin-top: 8px; font-weight: bold; word-break: break-all;"></p>
    </div>
  <div id="userDashboard" style="display: none; background: #0b0e14; border: 1px solid #2a2e3d; border-radius: 12px; padding: 15px; margin: 15px 0; text-align: left;">
    <h4 style="color: #f0b90b; margin: 0 0 12px 0; font-size: 0.95rem; border-bottom: 1px solid #2a2e3d; padding-bottom: 6px;">📊 Dashboard Analytics Anda</h4>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
        <div style="background: #131722; padding: 10px; border-radius: 8px; border: 1px solid #1e232d;">
            <span style="font-size: 0.75rem; color: #a0aec0;">Saldo AC Wallet:</span>
            <div style="font-weight: bold; color: #fff; font-size: 1rem; margin-top: 2px;"><span id="dashWalletBalance">0</span> AC</div>
        </div>
        <div style="background: #131722; padding: 10px; border-radius: 8px; border: 1px solid #1e232d;">
            <span style="font-size: 0.75rem; color: #a0aec0;">Total AC Di-Stake:</span>
            <div style="font-weight: bold; color: #f0b90b; font-size: 1rem; margin-top: 2px;"><span id="dashStakedBalance">0</span> AC</div>
        </div>
    </div>

    <div style="background: #131722; padding: 10px; border-radius: 8px; border: 1px solid #1e232d; display: flex; justify-content: space-between; align-items: center;">
        <span style="font-size: 0.8rem; color: #a0aec0;">Total Aset AC Portofolio:</span>
        <b style="color: #38a169; font-size: 1.1rem;"><span id="dashTotalAssets">0</span> AC</b>
    </div>
</div>

    <div class="staking-box">
        <h4 style="color: #f0b90b; margin: 0 0 8px 0; font-size: 0.95rem;">1. Stake AC Token</h4>
        <input type="number" id="stakeAmount" placeholder="Jumlah AC (contoh: 1000)" class="staking-input">
        <div style="display: flex; gap: 8px;">
            <button onclick="approveAC()" class="btn-web3 btn-primary">1. Approve AC</button>
            <button onclick="stakeAC()" class="btn-web3 btn-action">2. Stake AC</button>
        </div>
    </div>

    <div class="staking-box">
        <h4 style="color: #f0b90b; margin: 0 0 8px 0; font-size: 0.95rem;">2. Informasi & Klaim Reward</h4>
        <div style="display: flex; justify-content: space-between; align-items: center; background: #131722; padding: 12px; border-radius: 8px; margin: 10px 0; border: 1px solid #2a2e3d;">
            <span style="font-size: 0.85rem; color: #a0aec0;">Est. Reward Anda:</span>
            <b style="font-size: 1.2rem; color: #f0b90b;"><span id="rewardAmount">0</span> AC</b>
        </div>
        <button onclick="claimReward()" class="btn-web3 btn-primary">Klaim Reward</button>
        <button onclick="withdrawAC()" class="btn-web3 btn-danger">Withdraw Stake</button>
    </div>
</section>

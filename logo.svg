<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <radialGradient id="goldBg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="40%" stop-color="#FFB300" />
      <stop offset="80%" stop-color="#FF8F00" />
      <stop offset="100%" stop-color="#C77800" />
    </radialGradient>
    
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF59D" />
      <stop offset="25%" stop-color="#FBC02D" />
      <stop offset="50%" stop-color="#FFE082" />
      <stop offset="75%" stop-color="#F57F17" />
      <stop offset="100%" stop-color="#FFF9C4" />
    </linearGradient>

    <linearGradient id="textGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFDE7" />
      <stop offset="40%" stop-color="#FFF176" />
      <stop offset="100%" stop-color="#F57F17" />
    </linearGradient>

    <!-- Path untuk Teks Melingkar Atas & Bawah -->
    <path id="textArcTop" d="M 85,250 A 165,165 0 1,1 415,250" fill="none" />
    <path id="textArcBottom" d="M 415,250 A 165,165 0 0,1 85,250" fill="none" />
  </defs>

  <!-- Outer Coin Rim -->
  <circle cx="250" cy="250" r="240" fill="url(#goldRim)" stroke="#8D5B00" stroke-width="4" />
  <circle cx="250" cy="250" r="225" fill="none" stroke="#5D3A00" stroke-width="3" stroke-dasharray="6,4" />
  <circle cx="250" cy="250" r="215" fill="url(#goldBg)" stroke="#FFE082" stroke-width="3" />

  <!-- Inner Circle Rim -->
  <circle cx="250" cy="250" r="145" fill="none" stroke="#8D5B00" stroke-width="4" />
  <circle cx="250" cy="250" r="140" fill="none" stroke="#FFF9C4" stroke-width="2" />
  
  <!-- Curved Text Top (AFWAN COIN) -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="32" fill="url(#textGold)" stroke="#4E342E" stroke-width="1.5" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">AFWAN COIN</textPath>
  </text>

  <!-- Curved Text Bottom (UTILITY TOKEN) -->
  <text font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="20" fill="url(#textGold)" stroke="#3E2723" stroke-width="1" letter-spacing="3">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">UTILITY TOKEN</textPath>
  </text>

  <!-- Side Curved Details -->
  <text font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5D3A00" opacity="0.85">
    <textPath href="#textArcBottom" startOffset="12%" text-anchor="middle">TOTAL SUPPLY 10M AC</textPath>
  </text>
  <text font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#5D3A00" opacity="0.85">
    <textPath href="#textArcBottom" startOffset="88%" text-anchor="middle">30% SMART COLLATERAL</textPath>
  </text>

  <!-- Center Big Logo AC -->
  <g transform="translate(250, 245) scale(1.1)">
    <!-- Letters AC -->
    <text x="-10" y="25" font-family="Arial Black, Impact, sans-serif" font-weight="900" font-size="110" fill="url(#textGold)" stroke="#3E2723" stroke-width="4" text-anchor="middle" letter-spacing="-8">AC</text>
  </g>

  <!-- Bottom Stars & Sub-details -->
  <text x="250" y="365" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#4E342E" text-anchor="middle" letter-spacing="1">EST. 2026 | MALANG, INDONESIA</text>
  <circle cx="125" cy="250" r="4" fill="#FFF9C4" stroke="#5D3A00" />
  <circle cx="375" cy="250" r="4" fill="#FFF9C4" stroke="#5D3A00" />
</svg>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AC Mini Swap - Buy AFWAN COIN</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .swap-card { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
    .title { text-align: center; margin-bottom: 20px; font-size: 1.25rem; color: #f59e0b; }
    .input-group { background: #0f172a; border: 1px solid #334155; border-radius: 12px; padding: 12px; margin-bottom: 12px; }
    .input-group label { display: block; font-size: 0.8rem; color: #94a3b8; margin-bottom: 4px; }
    .input-row { display: flex; justify-content: space-between; align-items: center; }
    .input-row input { background: transparent; border: none; color: #fff; font-size: 1.2rem; outline: none; width: 60%; }
    .badge { background: #334155; padding: 4px 8px; border-radius: 6px; font-weight: bold; font-size: 0.9rem; }
    .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; margin-top: 8px; }
    .btn-connect { background: #f59e0b; color: #000; }
    .btn-swap { background: #10b981; color: #fff; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .status-text { font-size: 0.85rem; text-align: center; margin-top: 12px; color: #94a3b8; word-break: break-all; }
  </style>
</head>
<body>

<div class="swap-card">
  <div class="title">⚡ AC Instant Mini Swap</div>
  
  <button id="connectBtn" class="btn btn-connect" onclick="connectWallet()">Hubungkan Wallet</button>
  <div id="statusText" class="status-text"></div>

  <div style="margin-top: 16px;">
    <!-- Bayar USDT -->
    <div class="input-group">
      <label>Bayar</label>
      <div class="input-row">
        <input type="number" id="usdtInput" placeholder="0.0" step="0.1" oninput="calculateEstimate()">
        <span class="badge">USDT</span>
      </div>
    </div>

    <div style="text-align: center; color: #94a3b8; margin: -6px 0 6px 0;">⬇️</div>

    <!-- Terima AC -->
    <div class="input-group">
      <label>Estimasi Diterima</label>
      <div class="input-row">
        <input type="text" id="acOutput" placeholder="0.0" readonly>
        <span class="badge" style="color:#f59e0b;">AC</span>
      </div>
    </div>

    <!-- Tombol Eksekusi -->
    <button id="swapBtn" class="btn btn-swap" onclick="executeSwap()" disabled>Beli AC Sekarang</button>
  </div>
</div>

<script>
  const ROUTER_ADDR = "0x10ED433671D090DE300B7F0483543752373360e3";
const USDT_ADDR   = "0x55d398326f99059fF775485246999027B3197955";
const AC_ADDR     = "0x1493F4C3F6Ef8df9Fc2c774A613BDFdb6E4F7822";

// Pairing langsung sesuai pool PancakeSwap: USDT -> AC
const SWAP_PATH   = [USDT_ADDR, AC_ADDR];

async function calculateEstimate() {
  const amount = document.getElementById("usdtInput").value;
  if (!amount || amount <= 0 || !provider) return;
  
  try {
    const routerContract = new ethers.Contract(ROUTER_ADDR, ROUTER_ABI, provider);
    const parsedAmount = ethers.utils.parseUnits(amount.toString(), 18);
    
    const amounts = await routerContract.getAmountsOut(parsedAmount, SWAP_PATH);
    const acAmount = ethers.utils.formatUnits(amounts[1], 18);
    document.getElementById("acOutput").value = parseFloat(acAmount).toFixed(4);
  } catch (e) {
    document.getElementById("acOutput").value = "0.0";
  }
}

async function executeSwap() {
  const amountVal = document.getElementById("usdtInput").value;
  if (!amountVal || amountVal <= 0) return alert("Masukkan jumlah USDT!");

  const statusEl = document.getElementById("statusText");
  const swapBtn = document.getElementById("swapBtn");
  
  try {
    swapBtn.disabled = true;
    const amountIn = ethers.utils.parseUnits(amountVal.toString(), 18);
    const usdtContract = new ethers.Contract(USDT_ADDR, ERC20_ABI, signer);
    const routerContract = new ethers.Contract(ROUTER_ADDR, ROUTER_ABI, signer);

    // 1. Cek & Approve USDT
    statusEl.innerText = "Memeriksa izin USDT...";
    const allowance = await usdtContract.allowance(userAddress, ROUTER_ADDR);
    
    if (allowance.lt(amountIn)) {
      statusEl.innerText = "Konfirmasi Approve USDT di Wallet...";
      const txApprove = await usdtContract.approve(ROUTER_ADDR, ethers.constants.MaxUint256);
      await txApprove.wait();
    }

    // 2. Eksekusi Swap Direct USDT -> AC
    statusEl.innerText = "Memproses Swap di PancakeSwap...";
    const deadline = Math.floor(Date.now() / 1000) + 60 * 10; // 10 menit

    const txSwap = await routerContract.swapExactTokensForTokensSupportingFeeOnTransferTokens(
      amountIn,
      0, // amountOutMin 0 agar lolos dari masalah toleransi slippage awal
      SWAP_PATH,
      userAddress,
      deadline,
      { gasLimit: 300000 } // Batas gas manual untuk dompet seluler
    );

    statusEl.innerText = "Menunggu konfirmasi blok...";
    await txSwap.wait();
    
    statusEl.innerText = "✅ Berhasil membeli AFWAN COIN!";
    alert("Pembelian AC Berhasil!");
  } catch (err) {
    statusEl.innerText = "❌ Transaksi Gagal/Batal";
    console.error(err);
  } finally {
    swapBtn.disabled = false;
  }
}
</script>
</body>
</html>
